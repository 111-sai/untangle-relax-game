<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Untangle · 解开缠结 | 优雅解谜 流畅进化</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #19212b, #0f141c);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        /* 主容器 */
        .game-master {
            background: rgba(30, 38, 48, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 68px;
            padding: 20px 24px 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,200,0.15);
            border: 1px solid rgba(255,215,150,0.3);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 44px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(255,240,170,0.6);
            background: #fefaf0;
            cursor: grab;
            transition: filter 0.2s;
        }
        canvas:active { cursor: grabbing; }

        /* 面板 */
        .info-dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            background: #212b34c9;
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 10px 22px;
        }

        .stat-card {
            background: #2c1f2f4d;
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 48px;
            color: #ffecb3;
            font-weight: 600;
            display: flex;
            align-items: baseline;
            gap: 12px;
            box-shadow: inset 0 0 3px #ffdfaa, 0 4px 10px rgba(0,0,0,0.2);
        }
        .stat-label {
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .stat-value {
            font-size: 1.9rem;
            font-weight: 800;
            color: #ffdd99;
            line-height: 1;
        }
        .cross-badge .stat-value {
            color: #ffb77c;
            text-shadow: 0 0 5px #ff884d;
        }

        button {
            background: linear-gradient(135deg, #ffe6b3, #e7bc7e);
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #201e1a;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 6px 0 #916e3e;
            font-family: inherit;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #916e3e;
        }
        .btn-next {
            background: linear-gradient(135deg, #a6d6a6, #6f9e6f);
            box-shadow: 0 6px 0 #3c623c;
            color: #172012;
        }
        .achievement-badge {
            background: #00000066;
            border-radius: 40px;
            padding: 4px 16px;
            font-size: 0.7rem;
            color: #ffd58c;
        }

        .toast-message {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: #2d241eef;
            backdrop-filter: blur(12px);
            color: #ffe1aa;
            padding: 12px 28px;
            border-radius: 80px;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 0.9rem;
            z-index: 2000;
            pointer-events: none;
            white-space: nowrap;
            border-left: 4px solid #ffbb66;
            box-shadow: 0 8px 20px black;
            transition: opacity 0.2s;
        }

        @media (max-width: 680px) {
            .stat-value { font-size: 1.3rem; }
            .stat-card { padding: 3px 12px; gap: 6px; }
            button { padding: 6px 18px; font-size: 0.8rem; }
            .game-master { padding: 15px; }
        }
    </style>
</head>
<body>
<div class="game-master">
    <canvas id="untangleCanvas" width="860" height="620"></canvas>
    <div class="info-dashboard">
        <div class="stat-card">
            <span class="stat-label">🌀 关卡</span>
            <span class="stat-value" id="levelNum">1</span>
        </div>
        <div class="stat-card cross-badge">
            <span class="stat-label">✖️ 缠结数</span>
            <span class="stat-value" id="crossCount">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">🏆 完美通关</span>
            <span class="stat-value" id="perfectStreak">0</span>
        </div>
        <button id="resetBtn">⟳ 重置本关</button>
        <button id="nextBtn" class="btn-next">✨ 下一关 ✨</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 12px; flex-wrap: wrap;">
        <div class="achievement-badge">🎯 拖动圆点 · 消除所有交叉</div>
        <div class="achievement-badge" id="progressMsg">⚡ 交叉数为0自动过关</div>
    </div>
</div>

<script>
    (function(){
        // ---------- 高级配置 ----------
        const canvas = document.getElementById('untangleCanvas');
        const ctx = canvas.getContext('2d');
        const width = 860, height = 620;
        canvas.width = width;
        canvas.height = height;

        // 游戏状态
        let nodes = [];          // {id, x, y}
        let edges = [];          // [from, to]
        let currentLevel = 1;
        let perfectCount = 0;     // 连续完美通关计数 (无重置完成)
        let dragIndex = -1;
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;

        // 动态视觉
        let successAnimation = false;
        let successAlpha = 0;
        let requestId = null;

        // UI 元素
        const levelSpan = document.getElementById('levelNum');
        const crossSpan = document.getElementById('crossCount');
        const perfectSpan = document.getElementById('perfectStreak');
        const resetBtn = document.getElementById('resetBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressMsgDiv = document.getElementById('progressMsg');

        // ---------- 高级图论生成: 连通且保证可解，但初始随机位置会产生缠结，需要拖动解开 ----------
        function generateLevelData(level) {
            // 节点数递进: 4~12
            let nodeCount = 4;
            if(level === 1) nodeCount = 4;
            else if(level === 2) nodeCount = 5;
            else if(level <= 4) nodeCount = 6;
            else if(level <= 6) nodeCount = 7;
            else if(level <= 8) nodeCount = 8;
            else if(level <= 11) nodeCount = 9;
            else nodeCount = Math.min(10 + Math.floor((level-10)/2), 12);
            
            // 生成节点随机位置 (均匀散布但保留边界)
            let newNodes = [];
            for(let i=0;i<nodeCount;i++) {
                let margin = 70;
                let x = margin + Math.random() * (width - margin*2);
                let y = margin + Math.random() * (height - margin*2);
                newNodes.push({ id: i, x, y });
            }
            
            // 边集: 保证连通+随机附加 (复杂度符合放松解谜)
            let edgesSet = new Set();
            // 1. 构建生成树 (连通骨架)
            let connected = new Set([0]);
            let unconnected = [...Array(nodeCount).keys()].slice(1);
            while(unconnected.length) {
                let fromArr = [...connected];
                let from = fromArr[Math.floor(Math.random() * fromArr.length)];
                let toIdx = Math.floor(Math.random() * unconnected.length);
                let to = unconnected[toIdx];
                let key = `${Math.min(from,to)}-${Math.max(from,to)}`;
                if(!edgesSet.has(key)) {
                    edgesSet.add(key);
                    connected.add(to);
                    unconnected.splice(toIdx,1);
                }
            }
            // 2. 添加额外随机边 (边数 = 节点数*1.3 ~ 节点数*1.8)
            let targetEdgeCount = Math.floor(nodeCount * 1.3 + Math.random() * (nodeCount * 0.6));
            targetEdgeCount = Math.min(targetEdgeCount, nodeCount*(nodeCount-1)/2);
            let currentEdges = edgesSet.size;
            let attempts = 0;
            while(currentEdges < targetEdgeCount && attempts < 300) {
                let a = Math.floor(Math.random() * nodeCount);
                let b = Math.floor(Math.random() * nodeCount);
                if(a !== b) {
                    let key = `${Math.min(a,b)}-${Math.max(a,b)}`;
                    if(!edgesSet.has(key)) {
                        edgesSet.add(key);
                        currentEdges++;
                    }
                }
                attempts++;
            }
            let newEdges = [];
            for(let key of edgesSet) {
                let [f,t] = key.split('-').map(Number);
                newEdges.push([f,t]);
            }
            return { nodes: newNodes, edges: newEdges };
        }
        
        // 几何相交检测 (线段交叉，不含共享端点)
        function segIntersect(p1,p2,p3,p4) {
            function orient(a,b,c) {
                return (b.x-a.x)*(c.y-a.y) - (b.y-a.y)*(c.x-a.x);
            }
            function onSeg(a,b,c) {
                return Math.min(a.x,b.x) <= c.x && c.x <= Math.max(a.x,b.x) &&
                       Math.min(a.y,b.y) <= c.y && c.y <= Math.max(a.y,b.y);
            }
            let o1 = orient(p1,p2,p3);
            let o2 = orient(p1,p2,p4);
            let o3 = orient(p3,p4,p1);
            let o4 = orient(p3,p4,p2);
            if(o1===0 && onSeg(p1,p2,p3)) return true;
            if(o2===0 && onSeg(p1,p2,p4)) return true;
            if(o3===0 && onSeg(p3,p4,p1)) return true;
            if(o4===0 && onSeg(p3,p4,p2)) return true;
            return (o1>0) !== (o2>0) && (o3>0) !== (o4>0);
        }
        
        function countCrossings() {
            let cross = 0;
            for(let i=0;i<edges.length;i++) {
                for(let j=i+1;j<edges.length;j++) {
                    let e1=edges[i], e2=edges[j];
                    if(e1[0]===e2[0] || e1[0]===e2[1] || e1[1]===e2[0] || e1[1]===e2[1]) continue;
                    let p1=nodes[e1[0]], p2=nodes[e1[1]];
                    let p3=nodes[e2[0]], p4=nodes[e2[1]];
                    if(segIntersect(p1,p2,p3,p4)) cross++;
                }
            }
            return cross;
        }
        
        function updateCrossUI() {
            let crossVal = countCrossings();
            crossSpan.innerText = crossVal;
            if(crossVal === 0 && nodes.length > 0) {
                // 通关! 播放特效并增加完美连击
                progressMsgDiv.innerHTML = '🎉 完美解开！点击「下一关」继续 🎉';
                if(!successAnimation) {
                    successAnimation = true;
                    successAlpha = 0.7;
                    // 增加完美连击数
                    perfectCount++;
                    perfectSpan.innerText = perfectCount;
                    showFloatingMessage(`✨ 完美通关! 连击+1 ✨`, 1500);
                }
            } else {
                progressMsgDiv.innerHTML = '⚡ 拖动圆点消除所有交叉，交叉数归零过关 ⚡';
                if(successAnimation) {
                    successAnimation = false;
                }
            }
        }
        
        // 优雅提示
        let toastTimeout = null;
        function showFloatingMessage(msg, duration=1300) {
            let toastDiv = document.getElementById('dynamicUntangleToast');
            if(!toastDiv){
                toastDiv = document.createElement('div');
                toastDiv.id = 'dynamicUntangleToast';
                toastDiv.className = 'toast-message';
                document.body.appendChild(toastDiv);
            }
            toastDiv.innerText = msg;
            toastDiv.style.opacity = '1';
            if(toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(()=>{
                toastDiv.style.opacity = '0';
            }, duration);
        }
        
        // 重置当前关卡 (重新生成随机布局但保持边结构)
        function resetCurrentLevel() {
            let levelData = generateLevelData(currentLevel);
            nodes = levelData.nodes;
            edges = levelData.edges;
            // 边界修正
            for(let n of nodes) {
                n.x = Math.min(Math.max(n.x, 45), width-45);
                n.y = Math.min(Math.max(n.y, 45), height-45);
            }
            dragIndex = -1;
            isDragging = false;
            successAnimation = false;
            updateCrossUI();
            drawCanvasAnimated();
            showFloatingMessage(`🔄 重置关卡 ${currentLevel}，重新解谜`, 1000);
        }
        
        // 下一关
        function nextLevel() {
            if(countCrossings() !== 0) {
                showFloatingMessage(`⚠️ 还有 ${countCrossings()} 处缠结未解开，无法进入下一关 ⚠️`, 1500);
                return;
            }
            currentLevel++;
            levelSpan.innerText = currentLevel;
            // 重置全新数据
            let levelData = generateLevelData(currentLevel);
            nodes = levelData.nodes;
            edges = levelData.edges;
            for(let n of nodes) {
                n.x = Math.min(Math.max(n.x, 45), width-45);
                n.y = Math.min(Math.max(n.y, 45), height-45);
            }
            dragIndex = -1;
            successAnimation = false;
            updateCrossUI();
            drawCanvasAnimated();
            showFloatingMessage(`🌟 进入第 ${currentLevel} 关，节点更多，挑战升级！`, 1500);
        }
        
        // ---------- 华丽绘图 (渐变 + 光晕 + 动态成功特效) ----------
        function drawCanvasAnimated() {
            ctx.clearRect(0,0,width,height);
            // 背景细腻网格
            ctx.save();
            ctx.strokeStyle = "#ddd2b8";
            ctx.lineWidth = 0.5;
            for(let i=0;i<width;i+=35){
                ctx.beginPath();
                ctx.moveTo(i,0);
                ctx.lineTo(i,height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0,i);
                ctx.lineTo(width,i);
                ctx.stroke();
            }
            
            // 绘制柔和阴影边
            ctx.shadowBlur = 0;
            for(let edge of edges) {
                let fromNode = nodes[edge[0]];
                let toNode = nodes[edge[1]];
                if(!fromNode || !toNode) continue;
                ctx.beginPath();
                ctx.moveTo(fromNode.x, fromNode.y);
                ctx.lineTo(toNode.x, toNode.y);
                ctx.strokeStyle = "#b99e78";
                ctx.lineWidth = 3.2;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(fromNode.x, fromNode.y);
                ctx.lineTo(toNode.x, toNode.y);
                ctx.strokeStyle = "#ffeecc";
                ctx.lineWidth = 1.4;
                ctx.stroke();
            }
            
            // 节点: 宝石风格
            for(let i=0;i<nodes.length;i++) {
                let n = nodes[i];
                // 外晕影
                ctx.shadowBlur = 10;
                ctx.shadowColor = "rgba(0,0,0,0.25)";
                let grad = ctx.createRadialGradient(n.x-5, n.y-5, 5, n.x, n.y, 18);
                grad.addColorStop(0, "#ffdbb5");
                grad.addColorStop(1, "#e7a354");
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(n.x, n.y, 16, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#fff5e3";
                ctx.beginPath();
                ctx.arc(n.x-3, n.y-3, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#784e2a";
                ctx.font = `bold 16px "Segoe UI"`;
                ctx.shadowBlur = 2;
                ctx.fillText(i+1, n.x-7, n.y+7);
                if(dragIndex === i) {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 23, 0, Math.PI*2);
                    ctx.strokeStyle = "#ffc285";
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }
            
            // 成功特效：飘浮光粒子 + 光晕覆盖
            if(successAnimation && countCrossings() === 0) {
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.01) * 0.25;
                ctx.fillStyle = "#eaffb2";
                for(let i=0;i<60;i++) {
                    let t = Date.now() * 0.005 + i;
                    let xOff = Math.sin(t)*20;
                    let yOff = Math.cos(t*1.3)*15;
                    ctx.beginPath();
                    ctx.arc(width/2 + xOff, height/2 + yOff, 3, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = "#ffeeaa";
                ctx.fillRect(0,0,width,height);
                ctx.globalAlpha = 1;
            }
            ctx.shadowBlur = 0;
            // 显示通关横幅
            if(countCrossings() === 0 && nodes.length>0) {
                ctx.font = `bold 28px "Segoe UI", system-ui`;
                ctx.fillStyle = "#5f874fcc";
                ctx.shadowBlur = 0;
                ctx.fillText("✧ 完美解结 ✧", width-210, 65);
            }
        }
        
        // 渲染循环
        function animateRender() {
            drawCanvasAnimated();
            requestAnimationFrame(animateRender);
        }
        
        // ---------- 拖拽交互(全平台) ----------
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if(e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            canvasX = Math.min(Math.max(canvasX, 0), width);
            canvasY = Math.min(Math.max(canvasY, 0), height);
            return { mx: canvasX, my: canvasY };
        }
        
        function onPointerDown(e) {
            e.preventDefault();
            const { mx, my } = getCanvasCoords(e);
            let closest = -1;
            let minDist = 24;
            for(let i=0;i<nodes.length;i++) {
                let dx = nodes[i].x - mx;
                let dy = nodes[i].y - my;
                let d = Math.hypot(dx,dy);
                if(d < minDist) {
                    minDist = d;
                    closest = i;
                }
            }
            if(closest !== -1) {
                dragIndex = closest;
                isDragging = true;
                dragOffsetX = nodes[closest].x - mx;
                dragOffsetY = nodes[closest].y - my;
                canvas.style.cursor = 'grabbing';
                drawCanvasAnimated();
            }
        }
        
        function onPointerMove(e) {
            if(!isDragging || dragIndex === -1) return;
            e.preventDefault();
            const { mx, my } = getCanvasCoords(e);
            let newX = mx + dragOffsetX;
            let newY = my + dragOffsetY;
            newX = Math.min(Math.max(newX, 28), width-28);
            newY = Math.min(Math.max(newY, 28), height-28);
            nodes[dragIndex].x = newX;
            nodes[dragIndex].y = newY;
            updateCrossUI();
            drawCanvasAnimated();
        }
        
        function onPointerUp(e) {
            if(isDragging) {
                isDragging = false;
                dragIndex = -1;
                canvas.style.cursor = 'grab';
                updateCrossUI();
                drawCanvasAnimated();
                // 如果通关, 已经展示特效
                if(countCrossings() === 0 && nodes.length>0){
                    showFloatingMessage("🎉 解开缠结！点击下一关继续冒险 🎉", 1200);
                }
            }
        }
        
        // 初始化事件绑定
        function bindEvents() {
            canvas.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('touchstart', onPointerDown, {passive: false});
            window.addEventListener('touchmove', onPointerMove, {passive: false});
            window.addEventListener('touchend', onPointerUp);
            canvas.addEventListener('dragstart', (e)=>e.preventDefault());
            canvas.style.cursor = 'grab';
        }
        
        // 重置按钮, 下一关按钮
        function initControls() {
            resetBtn.addEventListener('click', ()=>{
                resetCurrentLevel();
                // 重置时连击数不重置，但根据规则重置会破坏连击? 通常设计重置不会导致惩罚（我们保留连击值但重置不增加）
                // 可选: 重置关卡不清空perfect，但考虑到公平，我们可以提示。这里保持不变。
                if(countCrossings() !==0) perfectSpan.innerText = perfectCount;
            });
            nextBtn.addEventListener('click', ()=>{
                if(countCrossings() === 0) {
                    nextLevel();
                } else {
                    showFloatingMessage(`还有 ${countCrossings()} 个交叉未解开，无法过关`, 1200);
                }
            });
        }
        
        // 首次启动 + 优雅初始关卡
        function firstLevelInitialize() {
            let initial = generateLevelData(1);
            nodes = initial.nodes;
            edges = initial.edges;
            for(let n of nodes){
                n.x = Math.min(Math.max(n.x, 55), width-55);
                n.y = Math.min(Math.max(n.y, 55), height-55);
            }
            updateCrossUI();
            drawCanvasAnimated();
        }
        
        // 启动
        function init() {
            firstLevelInitialize();
            bindEvents();
            initControls();
            animateRender();
        }
        
        init();
    })();
</script>
</body>
</html>
