<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Untangle · 优雅解谜 | 完美适配手机</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #19212b, #0f141c);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Quicksand', 'Inter', system-ui, sans-serif;
            padding: 12px;
        }
        .game-master {
            background: rgba(30, 38, 48, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: #fefaf0;
            cursor: grab;
            width: 100%;
            height: auto;
            touch-action: none;
        }
        canvas:active { cursor: grabbing; }

        /* 信息面板 - 移动端紧凑布局 */
        .info-dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            background: #212b34c9;
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 12px;
        }
        .stat-card {
            background: #2c1f2f80;
            border-radius: 40px;
            padding: 4px 12px;
            color: #ffecb3;
            font-weight: 600;
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            font-size: 0.8rem;
        }
        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffdd99;
        }
        button {
            background: linear-gradient(135deg, #ffe6b3, #e7bc7e);
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75rem;
            color: #201e1a;
            cursor: pointer;
            box-shadow: 0 3px 0 #916e3e;
            transition: 0.05s linear;
        }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #916e3e; }
        .btn-next {
            background: linear-gradient(135deg, #a6d6a6, #6f9e6f);
            box-shadow: 0 3px 0 #3c623c;
        }
        .achievement-badge {
            background: #00000066;
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 0.65rem;
            color: #ffd58c;
            text-align: center;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }
        @media (max-width: 550px) {
            .stat-card { font-size: 0.7rem; padding: 2px 8px; }
            .stat-value { font-size: 1rem; }
            button { padding: 4px 10px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="game-master">
    <canvas id="untangleCanvas" width="600" height="450"></canvas>
    <div class="info-dashboard">
        <div class="stat-card">🌀 关卡 <span class="stat-value" id="levelNum">1</span></div>
        <div class="stat-card">✖️ 缠结数 <span class="stat-value" id="crossCount">0</span></div>
        <div class="stat-card">🏆 完美通关 <span class="stat-value" id="perfectStreak">0</span></div>
        <button id="resetBtn">⟳ 重置</button>
        <button id="nextBtn" class="btn-next">✨ 下一关</button>
    </div>
    <div class="flex-row">
        <div class="achievement-badge">🎯 拖动圆点 · 消除所有交叉</div>
        <div class="achievement-badge" id="progressMsg">⚡ 交叉数为0过关</div>
    </div>
</div>

<script>
    (function(){
        // ---------- 自适应尺寸 ----------
        const canvas = document.getElementById('untangleCanvas');
        const ctx = canvas.getContext('2d');
        
        // 基础宽高比 4:3 (600x450)
        let baseWidth = 600;
        let baseHeight = 450;
        let width = baseWidth, height = baseHeight;
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxWidth = Math.min(container.clientWidth, 600);
            // 保持宽高比 600/450 = 1.333
            canvas.width = baseWidth;
            canvas.height = baseHeight;
            canvas.style.width = `${maxWidth}px`;
            canvas.style.height = 'auto';
            width = baseWidth;
            height = baseHeight;
            // 重新绘制
            if (nodes.length) drawCanvasAnimated();
        }
        window.addEventListener('resize', () => { resizeCanvas(); drawCanvasAnimated(); });
        
        // 游戏数据
        let nodes = [];
        let edges = [];
        let currentLevel = 1;
        let perfectCount = 0;
        let dragIndex = -1;
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;
        let successAnimation = false;
        let toastTimeout = null;

        const levelSpan = document.getElementById('levelNum');
        const crossSpan = document.getElementById('crossCount');
        const perfectSpan = document.getElementById('perfectStreak');
        const resetBtn = document.getElementById('resetBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressMsgDiv = document.getElementById('progressMsg');

        // ---------- 生成关卡 ----------
        function generateLevelData(level) {
            let nodeCount = 4;
            if(level === 1) nodeCount = 4;
            else if(level === 2) nodeCount = 5;
            else if(level <= 4) nodeCount = 6;
            else if(level <= 6) nodeCount = 7;
            else if(level <= 8) nodeCount = 8;
            else if(level <= 11) nodeCount = 9;
            else nodeCount = Math.min(10 + Math.floor((level-10)/2), 12);
            
            let margin = 55;
            let newNodes = [];
            for(let i=0;i<nodeCount;i++) {
                let x = margin + Math.random() * (width - margin*2);
                let y = margin + Math.random() * (height - margin*2);
                newNodes.push({ id: i, x, y });
            }
            
            let edgesSet = new Set();
            let connected = new Set([0]);
            let unconnected = [...Array(nodeCount).keys()].slice(1);
            while(unconnected.length) {
                let fromArr = [...connected];
                let from = fromArr[Math.floor(Math.random() * fromArr.length)];
                let toIdx = Math.floor(Math.random() * unconnected.length);
                let to = unconnected[toIdx];
                let key = `${Math.min(from,to)}-${Math.max(from,to)}`;
                if(!edgesSet.has(key)) {
                    edgesSet.add(key);
                    connected.add(to);
                    unconnected.splice(toIdx,1);
                }
            }
            let targetEdgeCount = Math.floor(nodeCount * 1.3 + Math.random() * (nodeCount * 0.6));
            targetEdgeCount = Math.min(targetEdgeCount, nodeCount*(nodeCount-1)/2);
            let currentEdges = edgesSet.size;
            let attempts = 0;
            while(currentEdges < targetEdgeCount && attempts < 300) {
                let a = Math.floor(Math.random() * nodeCount);
                let b = Math.floor(Math.random() * nodeCount);
                if(a !== b) {
                    let key = `${Math.min(a,b)}-${Math.max(a,b)}`;
                    if(!edgesSet.has(key)) {
                        edgesSet.add(key);
                        currentEdges++;
                    }
                }
                attempts++;
            }
            let newEdges = [];
            for(let key of edgesSet) {
                let [f,t] = key.split('-').map(Number);
                newEdges.push([f,t]);
            }
            return { nodes: newNodes, edges: newEdges };
        }
        
        // 相交检测
        function segIntersect(p1,p2,p3,p4) {
            function orient(a,b,c) {
                return (b.x-a.x)*(c.y-a.y) - (b.y-a.y)*(c.x-a.x);
            }
            function onSeg(a,b,c) {
                return Math.min(a.x,b.x) <= c.x && c.x <= Math.max(a.x,b.x) &&
                       Math.min(a.y,b.y) <= c.y && c.y <= Math.max(a.y,b.y);
            }
            let o1 = orient(p1,p2,p3);
            let o2 = orient(p1,p2,p4);
            let o3 = orient(p3,p4,p1);
            let o4 = orient(p3,p4,p2);
            if(o1===0 && onSeg(p1,p2,p3)) return true;
            if(o2===0 && onSeg(p1,p2,p4)) return true;
            if(o3===0 && onSeg(p3,p4,p1)) return true;
            if(o4===0 && onSeg(p3,p4,p2)) return true;
            return (o1>0) !== (o2>0) && (o3>0) !== (o4>0);
        }
        
        function countCrossings() {
            let cross = 0;
            for(let i=0;i<edges.length;i++) {
                for(let j=i+1;j<edges.length;j++) {
                    let e1=edges[i], e2=edges[j];
                    if(e1[0]===e2[0] || e1[0]===e2[1] || e1[1]===e2[0] || e1[1]===e2[1]) continue;
                    let p1=nodes[e1[0]], p2=nodes[e1[1]];
                    let p3=nodes[e2[0]], p4=nodes[e2[1]];
                    if(segIntersect(p1,p2,p3,p4)) cross++;
                }
            }
            return cross;
        }
        
        function updateCrossUI() {
            let crossVal = countCrossings();
            crossSpan.innerText = crossVal;
            if(crossVal === 0 && nodes.length > 0) {
                progressMsgDiv.innerHTML = '🎉 完美解开！点击下一关 🎉';
                if(!successAnimation) {
                    successAnimation = true;
                    perfectCount++;
                    perfectSpan.innerText = perfectCount;
                    showFloatingMessage(`✨ 完美通关! 连击+1 ✨`, 1200);
                }
            } else {
                progressMsgDiv.innerHTML = '⚡ 拖动圆点消除交叉 ⚡';
                if(successAnimation) successAnimation = false;
            }
        }
        
        function showFloatingMessage(msg, duration=1200) {
            let toastDiv = document.getElementById('dynamicToast');
            if(!toastDiv){
                toastDiv = document.createElement('div');
                toastDiv.id = 'dynamicToast';
                toastDiv.style.position = 'fixed';
                toastDiv.style.bottom = '30%';
                toastDiv.style.left = '50%';
                toastDiv.style.transform = 'translateX(-50%)';
                toastDiv.style.backgroundColor = '#2d241eef';
                toastDiv.style.color = '#ffe1aa';
                toastDiv.style.padding = '8px 20px';
                toastDiv.style.borderRadius = '60px';
                toastDiv.style.fontWeight = 'bold';
                toastDiv.style.fontSize = '0.8rem';
                toastDiv.style.zIndex = '9999';
                toastDiv.style.whiteSpace = 'nowrap';
                toastDiv.style.pointerEvents = 'none';
                document.body.appendChild(toastDiv);
            }
            toastDiv.innerText = msg;
            toastDiv.style.opacity = '1';
            if(toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(()=> toastDiv.style.opacity = '0', duration);
        }
        
        function resetCurrentLevel() {
            let levelData = generateLevelData(currentLevel);
            nodes = levelData.nodes;
            edges = levelData.edges;
            for(let n of nodes) {
                n.x = Math.min(Math.max(n.x, 35), width-35);
                n.y = Math.min(Math.max(n.y, 35), height-35);
            }
            dragIndex = -1;
            isDragging = false;
            successAnimation = false;
            updateCrossUI();
            drawCanvasAnimated();
            showFloatingMessage(`🔄 重置关卡 ${currentLevel}`, 800);
        }
        
        function nextLevel() {
            if(countCrossings() !== 0) {
                showFloatingMessage(`⚠️ 还有 ${countCrossings()} 个交叉未解开`, 1200);
                return;
            }
            currentLevel++;
            levelSpan.innerText = currentLevel;
            let levelData = generateLevelData(currentLevel);
            nodes = levelData.nodes;
            edges = levelData.edges;
            for(let n of nodes) {
                n.x = Math.min(Math.max(n.x, 35), width-35);
                n.y = Math.min(Math.max(n.y, 35), height-35);
            }
            dragIndex = -1;
            successAnimation = false;
            updateCrossUI();
            drawCanvasAnimated();
            showFloatingMessage(`🌟 第 ${currentLevel} 关，挑战升级`, 1200);
        }
        
        function drawCanvasAnimated() {
            ctx.clearRect(0,0,width,height);
            // 网格背景
            ctx.strokeStyle = "#ddd2b8";
            ctx.lineWidth = 0.8;
            for(let i=0;i<width;i+=35){
                ctx.beginPath();
                ctx.moveTo(i,0); ctx.lineTo(i,height); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0,i); ctx.lineTo(width,i); ctx.stroke();
            }
            // 边线
            for(let edge of edges) {
                let fromNode = nodes[edge[0]];
                let toNode = nodes[edge[1]];
                if(!fromNode || !toNode) continue;
                ctx.beginPath();
                ctx.moveTo(fromNode.x, fromNode.y);
                ctx.lineTo(toNode.x, toNode.y);
                ctx.strokeStyle = "#b99e78";
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(fromNode.x, fromNode.y);
                ctx.lineTo(toNode.x, toNode.y);
                ctx.strokeStyle = "#ffeecc";
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
            // 节点（半径缩小，适应小屏触控）
            let radius = 13;
            for(let i=0;i<nodes.length;i++) {
                let n = nodes[i];
                ctx.shadowBlur = 6;
                ctx.shadowColor = "rgba(0,0,0,0.3)";
                let grad = ctx.createRadialGradient(n.x-3, n.y-3, 4, n.x, n.y, radius+2);
                grad.addColorStop(0, "#ffdbb5");
                grad.addColorStop(1, "#e7a354");
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(n.x, n.y, radius, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#fff5e3";
                ctx.beginPath();
                ctx.arc(n.x-2, n.y-2, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#784e2a";
                ctx.font = `bold ${radius-2}px "Segoe UI"`;
                ctx.fillText(i+1, n.x-6, n.y+5);
                if(dragIndex === i) {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, radius+4, 0, Math.PI*2);
                    ctx.strokeStyle = "#ffc285";
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }
            }
            // 成功特效
            if(successAnimation && countCrossings() === 0) {
                ctx.globalAlpha = 0.5 + Math.sin(Date.now()*0.01)*0.25;
                ctx.fillStyle = "#eaffb2";
                for(let i=0;i<40;i++){
                    let t = Date.now()*0.005 + i;
                    let xOff = Math.sin(t)*20;
                    let yOff = Math.cos(t*1.3)*15;
                    ctx.beginPath();
                    ctx.arc(width/2 + xOff, height/2 + yOff, 3, 0, 2*Math.PI);
                    ctx.fill();
                }
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = "#ffeeaa";
                ctx.fillRect(0,0,width,height);
                ctx.globalAlpha = 1;
            }
            if(countCrossings() === 0 && nodes.length){
                ctx.font = `bold 22px "Segoe UI"`;
                ctx.fillStyle = "#5f874fcc";
                ctx.fillText("✓ 完美解结", width-150, 45);
            }
        }
        
        // 触摸坐标映射（自适应canvas实际显示大小）
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if(e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            canvasX = Math.min(Math.max(canvasX, 0), width);
            canvasY = Math.min(Math.max(canvasY, 0), height);
            return { mx: canvasX, my: canvasY };
        }
        
        function onPointerDown(e) {
            e.preventDefault();
            const { mx, my } = getCanvasCoords(e);
            let closest = -1;
            let minDist = 22;
            for(let i=0;i<nodes.length;i++) {
                let dx = nodes[i].x - mx;
                let dy = nodes[i].y - my;
                let d = Math.hypot(dx,dy);
                if(d < minDist) {
                    minDist = d;
                    closest = i;
                }
            }
            if(closest !== -1) {
                dragIndex = closest;
                isDragging = true;
                dragOffsetX = nodes[closest].x - mx;
                dragOffsetY = nodes[closest].y - my;
                canvas.style.cursor = 'grabbing';
                drawCanvasAnimated();
            }
        }
        
        function onPointerMove(e) {
            if(!isDragging || dragIndex === -1) return;
            e.preventDefault();
            const { mx, my } = getCanvasCoords(e);
            let newX = mx + dragOffsetX;
            let newY = my + dragOffsetY;
            newX = Math.min(Math.max(newX, 22), width-22);
            newY = Math.min(Math.max(newY, 22), height-22);
            nodes[dragIndex].x = newX;
            nodes[dragIndex].y = newY;
            updateCrossUI();
            drawCanvasAnimated();
        }
        
        function onPointerUp(e) {
            if(isDragging) {
                isDragging = false;
                dragIndex = -1;
                canvas.style.cursor = 'grab';
                updateCrossUI();
                drawCanvasAnimated();
                if(countCrossings() === 0 && nodes.length){
                    showFloatingMessage("🎉 完美解开！继续下一关", 1000);
                }
            }
        }
        
        function bindEvents() {
            canvas.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('touchstart', onPointerDown, {passive: false});
            window.addEventListener('touchmove', onPointerMove, {passive: false});
            window.addEventListener('touchend', onPointerUp);
            canvas.addEventListener('dragstart', e=>e.preventDefault());
        }
        
        function initControls() {
            resetBtn.onclick = () => resetCurrentLevel();
            nextBtn.onclick = () => {
                if(countCrossings() === 0) nextLevel();
                else showFloatingMessage(`还有 ${countCrossings()} 个交叉未解开`, 1000);
            };
        }
        
        function init() {
            resizeCanvas();
            let initial = generateLevelData(1);
            nodes = initial.nodes;
            edges = initial.edges;
            for(let n of nodes){
                n.x = Math.min(Math.max(n.x, 40), width-40);
                n.y = Math.min(Math.max(n.y, 40), height-40);
            }
            updateCrossUI();
            bindEvents();
            initControls();
            function animate(){
                drawCanvasAnimated();
                requestAnimationFrame(animate);
            }
            animate();
        }
        
        init();
    })();
</script>
</body>
</html>
